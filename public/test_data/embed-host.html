<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BrainBox embed host (test fixture)</title>
    <style>
        body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; }
        #brainbox-embed { width: 512px; height: 400px; border: 0; display: block; }
    </style>
</head>
<body>

<h1>Embed host</h1>

<!-- Test fixture for test/integration/embed.test.js. A real page at a real
     origin, so the cross-document postMessage path is exercised properly:
     page.setContent() would leave the host on about:blank, where the
     event.source identity check below cannot be tested honestly.
     The brain to embed is passed through as ?url=... -->
<iframe id="brainbox-embed" allow="fullscreen" allowfullscreen></iframe>

<script>
(function () {
    var params = new URLSearchParams(window.location.search);
    var src = '/mri/embed?url=' + encodeURIComponent(params.get('url') || '');
    ['view', 'slice', 'project', 'annotation', 'maxHeight'].forEach(function (key) {
        if (params.get(key)) { src += '&' + key + '=' + encodeURIComponent(params.get(key)); }
    });

    var embed = document.getElementById('brainbox-embed');
    embed.src = src;

    // Auto-size the embed to the height it reports. The viewer is laid out to
    // look right at any size, so this is an enhancement: removing this listener
    // must still leave a usable widget (asserted by test E7).
    window.addEventListener('message', function (event) {
        if (event.source !== embed.contentWindow) { return; }
        if (!event.data || event.data.type !== 'brainbox:embed-resize') { return; }
        var h = event.data.height;
        if (typeof h !== 'number' || !isFinite(h) || h <= 0 || h > 4000) { return; }
        embed.style.height = h + 'px';
    });
}());
</script>

</body>
</html>

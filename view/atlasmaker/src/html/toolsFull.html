<!-- BrainBox's panels, after the toolbar frame (nwl-components toolsFrame, built in atlasmaker-tools-full.js with toolsFullSlider, toolsFullButtons and toolsFullPenSize) -->

<!-- Loading indicator -->
<div id="loadingIndicator">
  <p>Loading...</p>
  <div class="disc"></div>
</div>
<!-- End Loading indicator -->

<!-- Labels -->
<!-- the close button stays while the labels scroll (nwl-components 3.2.0 .nwl-panel) -->
<div id="labelset" class="nwl-panel">
  <div class="nwl-panel-header">
      <img id="labels-close" class="button" alt="close" src="~nwl-components/dist/icons/times-circle.svg"/>
  </div>

  <div class="nwl-panel-body">
  <ul style="padding-left:1rem">
      <li>
          <b>Label Set</b><br/>
          <span id="labels-name"></span>
      </li>
      <li>
          <b>Labels</b><br/>
          <div id="label-list">
          </div>
          <div id="label-template">
              <div class="label-color"></div>
              <span class="label-name">Label Name</span>
          </div>
      </li>
  </ul>
  </div>
</div>
<!-- End Labels -->

<!-- black overlay -->
<div id="landmarksDialog" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:var(--nwl-bg-overlay);z-index:100">
  <!-- centered content -->
  <div style="position:relative;padding:1rem;margin:2rem auto;background-color:var(--nwl-bg-surface);max-width:600px;text-align:center;border:1px solid var(--nwl-border);height:calc(100% - 4rem);box-sizing:border-box">
    
    <h2 class="selection-header">Landmarks</h2>

    <!-- overflow: scroll -->
    <div style="display:inline-block;max-width:600px;padding:2rem;overflow:scroll;max-height:calc(100% - 10rem)">
      <table class="tabContent nwl-table">
        <thead>
          <tr>
            <th>Label</th>
            <th>Voxel Coordinates</th>
            <th>World Coordinates</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
      <div style="text-align:right">
        <img id="exportLandmarks" class="button" style="width:20px; height:20px; margin:8 2 0 0" src="~nwl-components/dist/icons/download-square.svg" title="download csv" alt="download csv"/>
        <img id="removeLandmark" class="button" style="width:20px; height:20px; margin:8 2 0 0" src="~nwl-components/dist/icons/minus-square.svg" title="remove landmark" alt="remove landmark entry"/>
      </div>  
    </div>

    <!-- Save/Cancel buttons -->
    <div style="display:block;margin:0 auto;max-width:200px">
        <h2 id="landmarksDialogOk" class="nwl-push-button">Save</h2>
        <h2 id="landmarksDialogCancel" class="nwl-push-button">Cancel</h2>
    </div>
  </div>
</div>

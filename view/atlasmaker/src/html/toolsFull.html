<div id="tools-side" style="display:block;height:100%">
  <div id="tools-minimized">
      <div>
          <img alt="menu" style="width:28px;position:absolute;top:10px;left:10px" src="~nwl-components/dist/icons/bars.svg" />
      </div>
  </div>

  <div id="tools-maximized" style="display:flex;flex-direction:column;height:100%">

      <!-- tools hide/show, display left/right -->
      <div id="headerBlock" style="flex:0 1 28px;background:#333">
          <div style="display:flex">
              <div style="flex:0 0 28px"><button type="button" id="display-minimize" title="Minimize toolbar" class="nwl-tool-button push noBorder"><img class="nwl-icon" alt="close" src="~nwl-components/dist/icons/times-circle.svg" /></button></div>
              <div id="toolsDragHandle" style="flex:1 1 auto;cursor:grab" title="Drag to move toolbar"></div>
              <div style="flex:0 0 28px"><button type="button" id="display-left" title="Display to the left" class="nwl-tool-button push noBorder"><img class="nwl-icon" alt="left" src="~nwl-components/dist/icons/caret-square-o-left.svg" /></button></div>
              <div style="flex:0 0 28px"><button type="button" id="display-right" title="Display to the right" class="nwl-tool-button push noBorder"><img class="nwl-icon" alt="right" src="~nwl-components/dist/icons/caret-square-o-right.svg" /></button></div>
          </div>
      </div>

      <!-- slider -->
      <div id="sliderBlock" style="flex:0 0 28px">
          <div style="display:flex">
              <div style="flex:0 0 28px">
                  <button type="button" id="prev" class="nwl-tool-button push">-</button>
              </div>
              <div style="flex:1 0 28px;display:flex">
                  <div style="flex:1;position:relative">
                      <div id="slice" class="slider" data-max="100" data-val="0" style="position:absolute;height:100%;margin-left:10px;width:calc(100% - 20px)">
                          <div class="track" style="position:absolute;left:0;top:50%;width:100%;border-top:1px solid #fff;padding:0;display:inline-block"></div>
                          <div class="thumb" style="position:absolute;left:0;top:50%;transform:translate(-10px,-10px);border-radius:10px;padding:0;width:20px;height:20px;background:#fff;display:inline-block"></div>
                      </div>
                  </div>
              </div>
              <div style="flex:0 0 28px">
                  <button type="button" id="next" class="nwl-tool-button push">+</button>
              </div>
          </div>
      </div>

      <!-- buttons -->
      <div id="buttonsBlock" style="flex:0 0 auto">
          <div style="display:flex;flex-wrap:wrap">

              <div style="flex:1 0 250px;width:50px">
                  <div id="plane" style="display:flex" class="chose">
                      <div style="flex:1"><button type="button" title="sag" class="nwl-tool-button nwl-tool-button--sub pressed">Sag</button></div>
                      <div style="flex:1"><button type="button" title="cor" class="nwl-tool-button nwl-tool-button--sub">Cor</button></div>
                      <div style="flex:1"><button type="button" title="axi" class="nwl-tool-button nwl-tool-button--sub">Axi</button></div>
                  </div>
                  <div style="display:flex">
                      <div style="flex:1"><button type="button" id="fullscreen" title="Full screen" class="nwl-tool-button toggle"><img class="nwl-icon" alt="fullscreen" src="~nwl-components/dist/icons/fullscreen.svg" /></button></div>
                      <div style="flex:1"><button type="button" id="3drender" title="3D render" class="nwl-tool-button push"><img class="nwl-icon" alt="3d render" src="~nwl-components/dist/icons/3drender.svg" /></button></div>
                      <div id="text" style="flex:2;display:flex" class="chose">
                          <div style="flex:1"><button type="button" id="bubble" title="Chat" class="nwl-tool-button nwl-tool-button--sub pressed"><img class="nwl-icon" alt="chat" src="~nwl-components/dist/icons/chat.svg" /></button></div>
                          <div style="flex:1"><button type="button" id="script" title="Script" class="nwl-tool-button nwl-tool-button--sub"><img class="nwl-icon" alt="script" src="~nwl-components/dist/icons/scroll.svg" /></button></div>
                      </div>
                      <div style="flex:1"><button type="button" id="link" title="Link" class="nwl-tool-button push"><img class="nwl-icon" alt="link" src="~nwl-components/dist/icons/link.svg" /></button></div>
                      <div style="flex:1"><button type="button" id="precise" title="Precise cursor" class="nwl-tool-button toggle"><img class="nwl-icon" alt="precise cursor" src="~nwl-components/dist/icons/preciseCursor.svg" /></button></div>
                  </div>
              </div>

              <div style="flex:1 0 250px;width:50px">
                  <div id="paintTool" style="display:flex" class="chose">
                      <div style="flex:1"><button type="button" title="Show" class="nwl-tool-button nwl-tool-button--sub pressed"><img class="nwl-icon" alt="show" src="~nwl-components/dist/icons/show.svg" /></button></div>
                      <div style="flex:1"><button type="button" title="Paint" class="nwl-tool-button nwl-tool-button--sub"><img class="nwl-icon" alt="paint" src="~nwl-components/dist/icons/paint.svg" /></button></div>
                      <div style="flex:1"><button type="button" title="Erase" class="nwl-tool-button nwl-tool-button--sub"><img class="nwl-icon" alt="erase" src="~nwl-components/dist/icons/erase.svg" /></button></div>
                      <div style="flex:1"><button type="button" title="Landmark" class="nwl-tool-button nwl-tool-button--sub"><img class="nwl-icon" alt="landmark" src="~nwl-components/dist/icons/landmark.svg" /></button></div>
                      <div style="flex:1"><button type="button" title="Measure" class="nwl-tool-button nwl-tool-button--sub"><img class="nwl-icon" alt="ruler" src="~nwl-components/dist/icons/ruler.svg" /></button></div>
                      <div style="flex:1"><button type="button" title="Adjust" class="nwl-tool-button nwl-tool-button--sub"><img class="nwl-icon" alt="adjust" src="~nwl-components/dist/icons/adjust.svg" /></button></div>
                      <div style="flex:1"><button type="button" title="Eyedrop" class="nwl-tool-button nwl-tool-button--sub"><img class="nwl-icon" alt="eyedropper" src="~nwl-components/dist/icons/eyedropper.svg" /></button></div>
                  </div>
                  <div style="display:flex">
                      <div style="flex:1"><button type="button" id="color" title="Color" style="height:24px;background:#f00" class="nwl-tool-button push"></button></div>
                      <div style="flex:1"><button type="button" id="fill" class="nwl-tool-button toggle"><img class="nwl-icon" alt="fill" src="~nwl-components/dist/icons/fill.svg" /></button></div>
                      <div style="flex:1"><button type="button" id="undo" title="Undo" class="nwl-tool-button push"><img class="nwl-icon" alt="undo" src="~nwl-components/dist/icons/undo.svg" /></button></div>
                      <div style="flex:1"><button type="button" id="upload" title="Upload" class="nwl-tool-button push"><img class="nwl-icon" alt="upload" src="~nwl-components/dist/icons/upload.svg" /></button></div>
                      <div style="flex:1"><button type="button" id="download" title="Download" class="nwl-tool-button push"><img class="nwl-icon" alt="download" src="~nwl-components/dist/icons/download.svg" /></button></div>
                      <div style="flex:1"><button type="button" id="save" title="Save" class="nwl-tool-button push"><img class="nwl-icon" alt="save" src="~nwl-components/dist/icons/save.svg" /></button></div>
                  </div>
              </div>

          </div>
      </div>

      <!-- pen size -->
      <div id="penSizeBlock" style="flex:0 0 28px">
          <div style="display:flex" class="chose" id="penSize">
              <div style="flex:1"><button type="button" title="1" class="nwl-tool-button nwl-tool-button--sub pressed">1</button></div>
              <div style="flex:1"><button type="button" title="2" class="nwl-tool-button nwl-tool-button--sub">2</button></div>
              <div style="flex:1"><button type="button" title="3" class="nwl-tool-button nwl-tool-button--sub">3</button></div>
              <div style="flex:1"><button type="button" title="5" class="nwl-tool-button nwl-tool-button--sub">5</button></div>
              <div style="flex:1"><button type="button" title="10" class="nwl-tool-button nwl-tool-button--sub">10</button></div>
              <div style="flex:1"><button type="button" title="15" class="nwl-tool-button nwl-tool-button--sub">15</button></div>
          </div>
      </div>

      <!-- notifications -->
      <div id="notificationsBlock" style="flex:0 1 auto;position:relative;display:flex">
          <div style="flex:1 1 28px"><div id="notifications" class="label">Chat (disconnected)</div></div>
      </div>

      <style>
          .token.message {
              color: red;
          }
          .codeflask__flatten {
              white-space: pre-wrap;
              word-wrap: break-word;
              caret-color:white;
              font-size:inherit;
          }
          .codeflask {
              background:rgba(0,0,0,1);
              position: relative;
          }
          #logChat:not(.hidden) {
              flex:1;
              height:auto;
              display:flex;
              flex-direction:column;
          }
      </style>

      <div id="textInputBlock" style="flex:0 0 270px;position:relative;display:flex;flex-direction:column;overflow:hidden">
          <div id="textInputBlockContent" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
              <div style="flex:1 1 80px;display:flex">
                  <div id="logChat">
                      <div style="flex:1 1 30px; overflow:scroll">
                          <div class="text" style="overflow:auto;height:100%"></div>
                      </div>
                      <div style="flex:0"><input id="msg" type="text" style="width:100%" /></div>
                  </div>
                  <div id="logScript" class="text hidden" style="flex:1;height:auto"></div>
              </div>
          </div>
          <div id="textInputResize" style="flex:0 0 12px;cursor:ns-resize;display:flex;align-items:center;justify-content:center">
              <div style="width:30px;height:3px;border-radius:2px;background:rgba(255,255,255,0.35)"></div>
          </div>
      </div>

  </div>

</div>

<!-- Loading indicator -->
<div id="loadingIndicator">
  <p>Loading...</p>
  <div class="disc"></div>
</div>
<!-- End Loading indicator -->

<!-- Labels -->
<div id="labelset">
  <div style="z-index:23;text-align:right">
      <img id="labels-close" class="button" alt="close" src="~nwl-components/dist/icons/times-circle.svg"/>
  </div>

  <ul style="padding-left:1rem">
      <li>
          <b>Label Set</b><br/>
          <span id="labels-name"></span>
      </li>
      <li>
          <b>Labels</b><br/>
          <div id="label-list">
          </div>
          <div id="label-template">
              <div class="label-color"></div>
              <span class="label-name">Label Name</span>
          </div>
      </li>
  </ul>
</div>
<!-- End Labels -->

<!-- black overlay -->
<div id="landmarksDialog" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,0.7);z-index:100">
  <!-- centered content -->
  <div style="position:relative;padding:1rem;margin:2rem auto;background-color:#333;max-width:600px;text-align:center;border:1px solid #777;height:calc(100% - 4rem);box-sizing:border-box">
    
    <h2 class="selection-header">Landmarks</h2>

    <!-- overflow: scroll -->
    <div style="display:inline-block;max-width:600px;padding:2rem;overflow:scroll;max-height:calc(100% - 10rem)">
      <table class="tabContent">
        <thead>
          <tr>
            <th>Label</th>
            <th>Voxel Coordinates</th>
            <th>World Coordinates</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
      <div style="text-align:right">
        <img id="exportLandmarks" class="button" style="width:20px; height:20px; margin:8 2 0 0" src="~nwl-components/dist/icons/download-square.svg" title="download csv" alt="download csv"/>
        <img id="removeLandmark" class="button" style="width:20px; height:20px; margin:8 2 0 0" src="~nwl-components/dist/icons/minus-square.svg" title="remove landmark" alt="remove landmark entry"/>
      </div>  
    </div>

    <!-- Save/Cancel buttons -->
    <div style="display:block;margin:0 auto;max-width:200px">
        <h2 id="landmarksDialogOk" class="nwl-push-button">Save</h2>
        <h2 id="landmarksDialogCancel" class="nwl-push-button">Cancel</h2>
    </div>
  </div>
</div>
